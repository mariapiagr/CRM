<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Inmobiliario</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#ffffff; --ink:#0e1a33; --sub:#6b7280; --line:#e3ded2;
  --navy:#0a1a3b; --red:#e0241a; --accent:#e0241a; --accent-ink:#ffffff; --danger:#b3452f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14171c; --panel:#1d2128; --ink:#eceae6; --sub:#9aa09b; --line:#33383a; }
}
:root[data-theme="dark"]{ --bg:#14171c; --panel:#1d2128; --ink:#eceae6; --sub:#9aa09b; --line:#33383a; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
header{background:var(--navy);color:#fff;padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.brandbar{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.mark{width:34px;height:34px;border-radius:50%;flex:none;object-fit:contain;background:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.grouphead{text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:6px}
.g-comprador{background:color-mix(in srgb, #2f6fe0 14%, transparent);color:#2f6fe0}
.g-vendedor{background:color-mix(in srgb, var(--red) 14%, transparent);color:var(--red)}
.brand-name{font-size:16px;font-weight:800;letter-spacing:.02em}
.brand-name b{color:var(--red)}
.brand-tag{font-size:12px;color:#c7cbd8;margin-top:1px}
.redline{height:4px;background:var(--red)}
nav{display:flex;gap:6px;padding:12px 20px;overflow-x:auto;max-width:1100px;margin:0 auto}
nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer;white-space:nowrap}
nav button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:0 20px 40px;max-width:1100px;margin:0 auto}
.toolbar{display:flex;gap:10px;align-items:center;margin:8px 0 14px;flex-wrap:wrap}
.toolbar input[type=text]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:14px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:14px;cursor:pointer}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:600px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb, var(--accent) 6%, transparent)}
.empty{padding:30px;text-align:center;color:var(--sub)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:10}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:480px;margin-top:20px}
.modal h2{margin:0 0 14px;font-size:17px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit}
.field textarea{min-height:60px;resize:vertical}
.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.status{font-size:12px;color:var(--sub);text-align:center;padding:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--sub);margin-top:2px}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;background:color-mix(in srgb, var(--red) 6%, transparent)}
.checkrow{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;font-size:13.5px;margin-bottom:4px;cursor:pointer}
.checkrow.done{background:color-mix(in srgb, #3fa34d 20%, transparent)}
.checkrow input{width:16px;height:16px;flex:none}
.brandfooter{padding:18px 20px 30px;text-align:center;font-size:11px;color:var(--sub);border-top:1px solid var(--line);margin-top:6px}
</style>
</head>

  const day=(date.getUTCDay()+6)%7; date.setUTCDate(date.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const week=1+Math.round(((date-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  const monday=new Date(d); monday.setDate(d.getDate()-((d.getDay()+6)%7));
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6);
  const f=x=>x.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
  return {key:date.getUTCFullYear()+"-W"+week, week, del:f(monday), al:f(sunday)};
}
async function renderSemanal(){
  tableWrap.innerHTML='<div class="empty">Calculando…</div>';
  let docs=[];
  try{ docs=await storage.list("registro_diario"); }catch(e){}
  if(!docs.length){ tableWrap.innerHTML='<div class="empty">Cargá días en Registro Diario para ver el resumen semanal.</div>'; return; }
  const weeks={};
  docs.forEach(r=>{ if(!r.fecha) return; const info=isoWeekInfo(new Date(r.fecha+"T00:00:00"));
    if(!weeks[info.key]) weeks[info.key]={...info, ...Object.fromEntries(KPI_COLS.map(c=>[c,0]))};
    KPI_COLS.forEach(c=>weeks[info.key][c]+= Number(r[c])||0);
  });
  const list=Object.values(weeks).sort((a,b)=>b.key.localeCompare(a.key));
  const head=`<th>Sem.</th><th>Del</th><th>Al</th>${KPI_COLS.map(c=>`<th>${KPI_LABELS[c]}</th>`).join("")}`;
  const body=list.map(w=>`<tr><td>${w.week}</td><td>${w.del}</td><td>${w.al}</td>${KPI_COLS.map(c=>`<td>${w[c]}</td>`).join("")}</tr>`).join("");
  tableWrap.innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function carteraEstado(p){
  if(p.estado==="Cerrado") return "amarillo";
  if(["Activo","Re-activado","Reservado","Captación"].includes(p.estado)){
    if(p.fecha_vencimiento){
      const dias=Math.ceil((new Date(p.fecha_vencimiento+"T00:00:00")-new Date())/86400000);
      if(dias<=15) return "rojo";
    }
    return "verde";
  }
  return null;
}
const CARTERA_COLOR={verde:"#3fa34d",rojo:"#e0241a",amarillo:"#e6c229"};
function diasHasta(fecha){ return Math.ceil((new Date(fecha+"T00:00:00")-new Date())/86400000); }
function propEstadoColor(p){
  if(p.estado==="Vencido") return CARTERA_COLOR.rojo;
  if(["Activo","Re-activado","Reservado","Captación"].includes(p.estado)){
    if(p.fecha_vencimiento){
      const dias=diasHasta(p.fecha_vencimiento);
      if(dias<0) return CARTERA_COLOR.rojo;
      if(dias<=15) return CARTERA_COLOR.amarillo;
    }
    return CARTERA_COLOR.verde;
  }
  return null;
}
function superficieTxt(r){
  const parts=[];
  if(r.m2_terreno) parts.push(r.m2_terreno+" terr.");
  if(r.m2_cubiertos) parts.push(r.m2_cubiertos+" cub.");
  if(r.m2_semicubiertos) parts.push(r.m2_semicubiertos+" semi.");
  if(r.m2_descubiertos) parts.push(r.m2_descubiertos+" desc.");
  return parts.length? parts.join(" · ")+" m²" : "—";
}
function vencimientoTxt(r){
  const c=propEstadoColor(r);
  if(c===CARTERA_COLOR.amarillo) return `Próxima a vencer (${diasHasta(r.fecha_vencimiento)} días)`;
  if(c===CARTERA_COLOR.rojo){
    if(r.fecha_vencimiento){ const d=diasHasta(r.fecha_vencimiento); return d<0? `Vencida (hace ${Math.abs(d)} días)` : "Vencida"; }
    return "Vencida";
  }
  return "—";
}
async function fillPropList(){
  let props=[];
  try{ props=await storage.list("propiedades"); }catch(e){}
  $("#propList").innerHTML = props.filter(p=>p.codigo).map(p=>`<option value="${p.codigo}">${p.codigo} — ${p.direccion||""}</option>`).join("");
}
function diasVencerTxt(p){
  if(!p.fecha_vencimiento) return "—";
  const dias=Math.ceil((new Date(p.fecha_vencimiento+"T00:00:00")-new Date())/86400000);
  return dias<0 ? "Vencida hace "+Math.abs(dias)+"d" : dias+" días";
}
async function renderCartera(){
  tableWrap.innerHTML='<div class="empty">Calculando…</div>';
  let props=[];
  try{ props=await storage.list("propiedades"); }catch(e){}
  const activas=props.filter(p=>["Activo","Re-activado"].includes(p.estado));
  const avg=(arr,f)=>arr.length? Math.round(arr.reduce((s,x)=>s+(Number(f(x))||0),0)/arr.length):0;
  const ticketProm=avg(activas.filter(p=>p.precio_publicacion), p=>p.precio_publicacion);
  const conFecha=activas.filter(p=>p.fecha_captacion);
  const diasProm=avg(conFecha, p=>Math.floor((Date.now()-new Date(p.fecha_captacion+"T00:00:00"))/86400000));
  const conBaja=props.filter(p=>p.baja_precio==="Sí").length;
  const porVencer=props.filter(p=>carteraEstado(p)==="rojo").length;
  const cards=[
    ["Activas",activas.length],
    ["Próximas a vencer",porVencer],
    ["Ticket prom. activas (USD)", ticketProm? "$"+ticketProm.toLocaleString("es-AR"):"—"],
    ["Días prom. en mercado", conFecha.length? diasProm:"—"],
    ["Con baja de precio", conBaja],
    ["Total cargadas",props.length],
  ];
  const porTipo={};
  activas.forEach(p=>{ const t=p.tipo||"Otro"; porTipo[t]=(porTipo[t]||0)+1; });
  const tipoRows=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
  const listado=props.filter(p=>carteraEstado(p));
  const rows2=listado.map(p=>{
    const c=CARTERA_COLOR[carteraEstado(p)];
    return `<tr><td><span class="dot" style="background:${c}"></span>${fmt(p.codigo)}</td><td>${fmt(p.direccion)}</td><td>${fmt(p.tipo)}</td><td>${p.precio_publicacion?"$"+Number(p.precio_publicacion).toLocaleString("es-AR"):"—"}</td><td>${fmt(p.estado)}</td><td>${diasVencerTxt(p)}</td><td>${fmt(p.proxima_accion)}</td><td>${fmt(p.propietario)}</td></tr>`;
  }).join("");
  tableWrap.innerHTML=`<div class="cards">${cards.map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
    <div style="padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap">${tipoRows.map(([t,n])=>`<div class="stat" style="padding:8px 12px"><div class="n" style="font-size:16px">${n}</div><div class="l">${t}</div></div>`).join("")||'<div class="l" style="padding:8px">Sin propiedades activas cargadas.</div>'}</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Código</th><th>Dirección</th><th>Tipo</th><th>Precio</th><th>Estado</th><th>Vence en</th><th>Próxima acción</th><th>Propietario</th></tr></thead><tbody>${rows2||'<tr><td colspan="8" class="empty">Sin datos.</td></tr>'}</tbody></table></div>`;
}

let db=null, currentTab="clientes", rows=[], editingId=null, actSelectedCodigo=null;
const storage = {
  async list(col){
    if(db){ const snap=await db.collection(col).get(); return snap.docs.map(d=>({id:d.id, ...d.data()})); }
    return JSON.parse(localStorage.getItem("crm_"+col)||"[]");
  },
  _save(col,list){ localStorage.setItem("crm_"+col, JSON.stringify(list)); },
  async add(col,data){
    if(db) return db.collection(col).add(data);
    const list=await storage.list(col);
    const id="id"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    list.push({id,...data}); storage._save(col,list);
  },
  async update(col,id,data){
    if(db) return db.collection(col).doc(id).update(data);
    const list=await storage.list(col);
    const i=list.findIndex(x=>x.id===id);
    if(i>-1){ list[i]={...list[i],...data}; storage._save(col,list); }
  },
  async remove(col,id){
    if(db) return db.collection(col).doc(id).delete();
    storage._save(col, (await storage.list(col)).filter(x=>x.id!==id));
  }
};

async function renderActividad(){
  tableWrap.innerHTML='<div class="empty">Cargando…</div>';
  let props=[], acts=[];
  try{ props=await storage.list("propiedades"); }catch(e){}
  try{ acts=await storage.list("actividad"); }catch(e){}
  const activas=props.filter(p=>["Activo","Re-activado"].includes(p.estado) && p.codigo)
    .sort((a,b)=>String(a.direccion||"").localeCompare(String(b.direccion||"")));
  if(!activas.length){ tableWrap.innerHTML='<div class="empty">No hay propiedades activas cargadas (cargalas en la solapa Propiedades).</div>'; return; }
  if(!actSelectedCodigo || !activas.some(p=>p.codigo===actSelectedCodigo)) actSelectedCodigo=activas[0].codigo;
  const steps=SCHEMAS.actividad.fields.filter(f=>f.k!=="propiedad_codigo");
  const recFor=cod=>acts.find(a=>a.propiedad_codigo===cod);
  const rec=recFor(actSelectedCodigo);
  const done=rec? steps.filter(f=>rec[f.k]==="Sí").length : 0;
  const options=activas.map(p=>{
    const r=recFor(p.codigo); const d=r? steps.filter(f=>r[f.k]==="Sí").length : 0;
    return `<option value="${p.codigo}" ${p.codigo===actSelectedCodigo?"selected":""}>${p.codigo} — ${p.direccion||"s/dirección"} (${d}/${steps.length})</option>`;
  }).join("");
  const rowsHtml=steps.map(f=>{
    const checked = rec && rec[f.k]==="Sí";
    return `<label class="checkrow ${checked?"done":""}"><input type="checkbox" ${checked?"checked":""} onchange="toggleActividad('${f.k}',this.checked)"><span>${f.l}</span></label>`;
  }).join("");
  tableWrap.innerHTML=`<div style="padding:14px 16px 0">
      <select id="actSel" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:14px;margin-bottom:10px">${options}</select>
      <div class="l" style="margin-bottom:10px">Avance: <strong>${done}/${steps.length}</strong></div>
    </div>
    <div style="padding:0 16px 20px">${rowsHtml}</div>`;
  $("#actSel").onchange=e=>{ actSelectedCodigo=e.target.value; renderActividad(); };
}
window.toggleActividad=async function(key,checked){
  let acts=[];
  try{ acts=await storage.list("actividad"); }catch(e){}
  const rec=acts.find(a=>a.propiedad_codigo===actSelectedCodigo);
  try{
    if(rec){ await storage.update("actividad", rec.id, {[key]: checked?"Sí":"No"}); }
    else{ await storage.add("actividad", {propiedad_codigo:actSelectedCodigo,[key]: checked?"Sí":"No"}); }
  }catch(e){}
  renderActividad();
};

const $=s=>document.querySelector(s);
const tabsEl=$("#tabs"), tableWrap=$("#tableWrap"), statusEl=$("#status");

function buildTabs(){
  tabsEl.innerHTML="";
  Object.keys(SCHEMAS).forEach(key=>{
    const b=document.createElement("button");
    b.textContent=SCHEMAS[key].title;
    b.className=key===currentTab?"active":"";
    b.onclick=()=>{currentTab=key; buildTabs(); loadTab();};
    tabsEl.appendChild(b);
  });
}

async function loadTab(){
  const schema=SCHEMAS[currentTab];
  document.querySelector(".toolbar").style.display = schema.computed ? "none" : "flex";
  $("#hideDoneWrap").style.display = currentTab==="agenda" ? "flex" : "none";
  tableWrap.innerHTML='<div class="empty">Cargando…</div>';
  statusEl.textContent = db ? "" : "Guardando en este navegador (modo local).";
  statusEl.textContent="";
  if(schema.computed==="semanal") return renderSemanal();
  if(schema.computed==="cartera") return renderCartera();
  if(schema.computed==="actividad") return renderActividad();
  try{
    rows = await storage.list(currentTab);
    if(schema.sortBy) rows.sort((a,b)=>String(a[schema.sortBy]||"").localeCompare(String(b[schema.sortBy]||"")));
  }catch(e){ rows=[]; statusEl.textContent="No se pudieron cargar los datos."; }
  renderTable(rows);
}

function renderTable(list){
  const schema = SCHEMAS[currentTab];
  const cols = schema.columns;
  const q = $("#search").value.trim().toLowerCase();
  let filtered = q ? list.filter(r=>cols.some(c=>String(r[c]||"").toLowerCase().includes(q))) : list;
  if(currentTab==="agenda" && $("#hideDone").checked) filtered = filtered.filter(r=>r.completado!=="Sí");
  if(!filtered.length){ tableWrap.innerHTML='<div class="empty">No hay registros todavía.</div>'; return; }
  const head = cols.map(c=>`<th>${label(c)}</th>`).join("");
  const body = filtered.map(r=>`<tr onclick="openForm('${r.id}')" style="${r.completado==='Sí'?'opacity:.5':''}">${cols.map(c=>{
    if(c==="completado") return `<td onclick="event.stopPropagation()"><input type="checkbox" ${r.completado==="Sí"?"checked":""} onchange="toggleCompletado('${r.id}',this.checked)"></td>`;
    const fdef = schema.fields.find(f=>f.k===c);
    let v = c==="_progreso" ? progreso(r) : c==="_superficie" ? superficieTxt(r) : c==="_vencimiento" ? vencimientoTxt(r) : (fdef&&fdef.money ? moneyFmt(r[c]) : fmt(r[c]));
    if(schema.colorField===c && r[c]){
      const hex = schema.colorFn ? schema.colorFn(r) : actColor(r[c]);
      if(hex) v = `<span class="dot" style="background:${hex}"></span>${v}`;
    }
    return `<td>${v}</td>`;
  }).join("")}</tr>`).join("");
  let foot="";
  if(schema.totals){
    const cells=cols.map((c,i)=> schema.totals.includes(c)
      ? filtered.reduce((s,r)=>s+(Number(r[c])||0),0).toLocaleString("es-AR")
      : (i===0?"Total":""));
    foot=`<tfoot><tr>${cells.map(c=>`<td>${c}</td>`).join("")}</tr></tfoot>`;
  }
  tableWrap.innerHTML = `<table><thead>${groupHeadRow(schema)}<tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table>` + (currentTab==="ventas" ? ventasTotalsHtml(rows) : "");
}
function groupHeadRow(schema){
  if(!schema.groupLabels) return "";
  return "<tr>"+schema.groupLabels.map((l,i)=>`<th colspan="${schema.groupSpans[i]}" class="grouphead ${l==="Comprador"?"g-comprador":l==="Vendedor"?"g-vendedor":""}">${l}</th>`).join("")+"</tr>";
}
function moneyFmt(v){ if(v===undefined||v===null||v==="") return "—"; return Number(v).toLocaleString("es-AR"); }
function ventasTotalsHtml(list){
  const porMes={}, porAnio={};
  list.forEach(r=>{
    if(!r.fecha) return;
    const key=r.fecha.slice(0,7), anio=r.fecha.slice(0,4);
    if(!porMes[key]) porMes[key]={venta:0,comision:0,cant:0};
    porMes[key].venta+=Number(r.precio_venta)||0;
    porMes[key].comision+=Number(r.comision_agente)||0;
    porMes[key].cant++;
    if(!porAnio[anio]) porAnio[anio]={venta:0,comision:0,cant:0};
    porAnio[anio].venta+=Number(r.precio_venta)||0;
    porAnio[anio].comision+=Number(r.comision_agente)||0;
    porAnio[anio].cant++;
  });
  const meses=Object.keys(porMes).sort();
  const anios=Object.keys(porAnio).sort();
  if(!meses.length) return "";
  const filasMes=meses.map(m=>{
    const d=porMes[m]; const [y,mo]=m.split("-");
    const nombre=new Date(Number(y),Number(mo)-1,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});
    return `<tr><td>${nombre}</td><td>${d.cant}</td><td>${d.venta.toLocaleString("es-AR")}</td><td>${d.comision.toLocaleString("es-AR")}</td></tr>`;
  }).join("");
  const filasAnio=anios.map(a=>{
    const d=porAnio[a];
    return `<tr><td>${a}</td><td>${d.cant}</td><td>${d.venta.toLocaleString("es-AR")}</td><td>${d.comision.toLocaleString("es-AR")}</td></tr>`;
  }).join("");
  const totVenta=meses.reduce((s,m)=>s+porMes[m].venta,0), totCom=meses.reduce((s,m)=>s+porMes[m].comision,0), totCant=meses.reduce((s,m)=>s+porMes[m].cant,0);
  return `<div style="padding:18px 12px 4px;font-weight:600;font-size:13px">Totales por mes</div>
  <table><thead><tr><th>Mes</th><th>Ventas</th><th>Monto total (USD)</th><th>Comisión agente (USD)</th></tr></thead>
  <tbody>${filasMes}</tbody>
  <tfoot><tr><td>Total</td><td>${totCant}</td><td>${totVenta.toLocaleString("es-AR")}</td><td>${totCom.toLocaleString("es-AR")}</td></tr></tfoot></table>
  <div style="padding:18px 12px 4px;font-weight:600;font-size:13px">Totales por año</div>
  <table><thead><tr><th>Año</th><th>Ventas</th><th>Monto total (USD)</th><th>Comisión agente (USD)</th></tr></thead>
  <tbody>${filasAnio}</tbody></table>`;
}
window.toggleCompletado=async function(id,checked){
  try{ await storage.update("agenda", id, {completado: checked?"Sí":"No"}); }catch(e){}
  loadTab();
};
function label(k){ if(k==="_progreso") return "Avance"; if(k==="completado") return "✓"; if(k==="_superficie") return "Superficie"; if(k==="_vencimiento") return "Vence en"; const f=SCHEMAS[currentTab].fields.find(f=>f.k===k); return f?f.l:k; }
function fmt(v){ if(v===undefined||v===null||v==="") return "—"; const s=String(v); return s.length>60 ? s.slice(0,60)+"…" : s; }

$("#search").addEventListener("input", ()=>renderTable(rows));
$("#hideDone").addEventListener("change", ()=>renderTable(rows));

function openForm(id){
  editingId=id||null;
  const schema = SCHEMAS[currentTab];
  $("#modalTitle").textContent = editingId ? "Editar "+schema.title.slice(0,-1) : "Nuevo "+schema.title.slice(0,-1);
  const rec = editingId ? rows.find(r=>r.id===editingId) || {} : {};
  if(!editingId && currentTab==="propiedades" && !rec.codigo){
    rec.codigo = "PROP-"+String(rows.length+1).padStart(4,"0");
  }
  const form = $("#form");
  form.innerHTML = schema.fields.map(f=>{
    const val = rec[f.k]!==undefined ? rec[f.k] : "";
    if(f.t==="check"){
      return `<label class="checkrow ${val==='Sí'?'done':''}"><input type="checkbox" name="${f.k}" ${val==='Sí'?'checked':''} oninput="this.closest('label').classList.toggle('done',this.checked)"><span>${f.l}</span></label>`;
    }
    if(f.t==="select"){
      return `<div class="field"><label>${f.l}</label><select name="${f.k}">
        <option value="">—</option>
        ${f.o.map(o=>`<option value="${o}" ${o===val?"selected":""}>${o}</option>`).join("")}
      </select></div>`;
    }
    if(f.t==="textarea"){
      return `<div class="field"><label>${f.l}</label><textarea name="${f.k}">${val}</textarea></div>`;
    }
    return `<div class="field"><label>${f.l}</label><input type="${f.t}" name="${f.k}" value="${val}" ${f.req?"required":""} ${f.datalist?'list="propList"':""}></div>`;
  }).join("");
  if(schema.fields.some(f=>f.datalist)) fillPropList();
  $("#deleteBtn").style.display = editingId ? "inline-block" : "none";
  $("#gcalBtn").style.display = currentTab==="agenda" ? "inline-block" : "none";
  $("#modalBg").classList.add("show");
}
$("#addBtn").onclick=()=>openForm(null);
$("#gcalBtn").onclick=()=>{
  const fd=new FormData($("#form"));
  const fecha=fd.get("fecha"); if(!fecha){ alert("Completá la fecha primero."); return; }
  const hora=fd.get("hora");
  const titulo=[fd.get("tipo"),fd.get("detalle")].filter(Boolean).join(": ")||"Evento";
  const d=fecha.replace(/-/g,"");
  let dates;
  if(hora){
    const [h,m]=hora.split(":");
    const start=d+"T"+h+m+"00";
    const endD=new Date(fecha+"T"+hora+":00"); endD.setHours(endD.getHours()+1);
    const end=endD.getFullYear()+String(endD.getMonth()+1).padStart(2,"0")+String(endD.getDate()).padStart(2,"0")+"T"+String(endD.getHours()).padStart(2,"0")+String(endD.getMinutes()).padStart(2,"0")+"00";
    dates=start+"/"+end;
  }else{
    const nd=new Date(fecha+"T00:00:00"); nd.setDate(nd.getDate()+1);
    const end=nd.getFullYear()+String(nd.getMonth()+1).padStart(2,"0")+String(nd.getDate()).padStart(2,"0");
    dates=d+"/"+end;
  }
  const url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${dates}&details=${encodeURIComponent(fd.get("notas")||"")}`;
  window.open(url,"_blank");
};
$("#cancelBtn").onclick=()=>$("#modalBg").classList.remove("show");
$("#modalBg").onclick=(e)=>{ if(e.target.id==="modalBg") $("#modalBg").classList.remove("show"); };

$("#form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const data={};
  const fields=SCHEMAS[currentTab].fields;
  new FormData(e.target).forEach((v,k)=>{ data[k]= (fields.find(f=>f.k===k)?.t==="number" && v!=="") ? Number(v) : v; });
  fields.filter(f=>f.t==="check").forEach(f=>{ if(!(f.k in data)) data[f.k]="No"; });
  try{
    if(editingId){ await storage.update(currentTab, editingId, data); }
    else{ await storage.add(currentTab, data); }
    if(!editingId && currentTab==="agenda" && data.tipo==="Visitas"){
      try{ await storage.add("visitas", {fecha:data.fecha, propiedad:data.detalle||"", ubicacion:"", cliente:"", accion_siguiente:"", nueva_visita:"No", observaciones:data.notas||""}); }catch(e){}
    }
    $("#modalBg").classList.remove("show");
    loadTab();
  }catch(err){ statusEl.textContent="No se pudo guardar el registro."; }
});

$("#deleteBtn").onclick=async()=>{
  if(!editingId) return;
  if(!confirm("¿Eliminar este registro?")) return;
  try{ await storage.remove(currentTab, editingId); }catch(e){}
  $("#modalBg").classList.remove("show");
  loadTab();
};

  buildTabs();
  try{ db = await claude.use("db"); }catch(e){ db=null; }
  loadTab();
})();
